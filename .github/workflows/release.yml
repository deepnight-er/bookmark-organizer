name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify tag matches package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('Tag and package version differ')"
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - name: Generate notes for this version
        run: node scripts/releases.cjs --notes release-notes.md
      - name: Create draft release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*-extension.zip dist/*-webstore.zip dist/*-source.zip dist/*.html --verify-tag --notes-file release-notes.md --draft
